name: Build RezeOS GSI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl xz-utils e2fsprogs erofs-utils file android-sdk-libsparse-utils 7zip

      - name: Download LineageOS GSI
        run: |
          set -euo pipefail
          source config/reze.env
          mkdir -p work/archive work/extracted out

          echo '--- downloading LineageOS GSI archive ---'
          curl -fL --retry 5 --retry-delay 3 -o work/base.7z "$BASE_URL"
          file work/base.7z

          echo '--- archive contents ---'
          7z l work/base.7z | tail -30

          echo '--- extracting archive ---'
          7z x -y -owork/extracted work/base.7z

          echo '--- extracted files ---'
          find work/extracted -type f -maxdepth 5 -printf '%p (%s bytes)\n' | head -100

          IMAGE="$(find work/extracted -type f \( -iname '*.img' -o -iname '*.img.raw' \) -print -quit)"
          if [ -z "$IMAGE" ]; then
            echo 'No Android image found in LineageOS archive.'
            exit 1
          fi

          echo "Using image: $IMAGE"
          cp "$IMAGE" work/base.img
          file work/base.img

      - name: Convert sparse image and detect filesystem
        run: |
          set -euo pipefail
          if file work/base.img | grep -qi 'Android sparse image'; then
            simg2img work/base.img work/system.raw.img
          else
            cp work/base.img work/system.raw.img
          fi

          echo '--- filesystem ---'
          file work/system.raw.img
          FS_INFO="$(file -b work/system.raw.img)"

          if grep -qiE 'EROFS filesystem' <<< "$FS_INFO"; then
            DETECTED_FS=erofs
          elif grep -qiE 'ext[234] filesystem' <<< "$FS_INFO"; then
            DETECTED_FS=ext4
          else
            echo 'Unsupported filesystem:'
            printf '%s\n' "$FS_INFO"
            exit 2
          fi

          echo "Detected filesystem: $DETECTED_FS"
          echo "FS_TYPE=$DETECTED_FS" >> "$GITHUB_ENV"

      - name: Prepare filesystem for modification
        run: |
          set -euo pipefail
          rm -rf work/root work/mnt
          mkdir -p work/root work/mnt

          if [ "$FS_TYPE" = "ext4" ]; then
            echo '--- ext4 feature inspection ---'
            sudo dumpe2fs -h work/system.raw.img 2>/dev/null | grep -E 'Filesystem features|Block size|Block count' || true

            FS_FEATURES="$(sudo dumpe2fs -h work/system.raw.img 2>/dev/null | sed -n 's/^Filesystem features:[[:space:]]*//p')"
            echo "Filesystem features: $FS_FEATURES"

            if grep -qw 'shared_blocks' <<< "$FS_FEATURES"; then
              echo 'shared_blocks detected; unsharing ext4 blocks'
              sudo e2fsck -fy -E unshare_blocks work/system.raw.img
            else
              sudo e2fsck -fy work/system.raw.img
            fi

            echo '--- ext4 features after fsck ---'
            sudo dumpe2fs -h work/system.raw.img 2>/dev/null | grep -E 'Filesystem features|Block size|Block count' || true

            echo '--- test read-only mount ---'
            if ! sudo mount -t ext4 -o loop,ro work/system.raw.img work/mnt; then
              echo 'Read-only mount failed; kernel diagnostics:'
              dmesg | tail -100 || true
              sudo dumpe2fs -h work/system.raw.img 2>/dev/null || true
              exit 1
            fi
            sudo umount work/mnt

            echo '--- mount read-write ---'
            if ! sudo mount -t ext4 -o loop,rw work/system.raw.img work/mnt; then
              echo 'Read-write mount failed; kernel diagnostics:'
              dmesg | tail -100 || true
              sudo dumpe2fs -h work/system.raw.img 2>/dev/null || true
              exit 1
            fi

            sudo cp -a work/mnt/. work/root/
            sudo umount work/mnt
          else
            echo 'Extracting EROFS image'
            sudo fsck.erofs --extract=work/root work/system.raw.img
          fi

          find work/root -maxdepth 2 -type d | head -50

      - name: Apply RezeOS modifications
        run: |
          set -euo pipefail
          sudo env \
            SYSTEM_DIR="$PWD/work/root" \
            REZEOS_NAME=RezeOS \
            REZEOS_VERSION=1.0-BETA \
            REZEOS_CODENAME=Reze \
            bash scripts/modify-system.sh

      - name: Rebuild system image
        run: |
          set -euo pipefail
          rm -f work/rebuilt.raw.img work/system.img

          if [ "$FS_TYPE" = "ext4" ]; then
            echo 'Mounting original ext4 image for update'
            sudo mount -t ext4 -o loop,rw work/system.raw.img work/mnt
            sudo cp -a work/root/. work/mnt/
            sync
            sudo umount work/mnt
            sudo e2fsck -fy work/system.raw.img
            mv work/system.raw.img work/rebuilt.raw.img
          else
            echo 'Rebuilding EROFS image'
            mkfs.erofs -zlz4hc work/rebuilt.raw.img work/root
          fi

          echo '--- rebuilt image ---'
          file work/rebuilt.raw.img

      - name: Repack Android sparse image
        run: |
          set -euo pipefail
          img2simg work/rebuilt.raw.img work/system.img
          file work/system.img
          xz -T0 -9 -c work/system.img > out/RezeOS-GSI-arm64-ab.img.xz
          sha256sum out/RezeOS-GSI-arm64-ab.img.xz > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: RezeOS-GSI
          path: out/
          if-no-files-found: error
