name: Build RezeOS GSI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils e2fsprogs erofs-utils file android-sdk-libsparse-utils 7zip

      - name: Download RezeOS base GSI
        run: |
          set -euo pipefail
          source config/reze.env
          mkdir -p work/extracted out assets
          # Decode the supplied Reze wallpaper into the build workspace.
          WALLPAPER_B64=''
          printf '%s' "$WALLPAPER_B64" | base64 -d > assets/reze-wallpaper.webp
          file assets/reze-wallpaper.webp

          echo '--- downloading RezeOS base GSI ---'
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --output work/base.7z "$BASE_URL"
          file work/base.7z
          7z x -y -owork/extracted work/base.7z

          mapfile -t IMAGES < <(find work/extracted -type f \( -iname '*.img' -o -iname '*.img.raw' \) -printf '%p\n' | sort)
          [ "${#IMAGES[@]}" -gt 0 ] || { echo 'No Android system image found.'; exit 1; }

          IMAGE=''
          for candidate in "${IMAGES[@]}"; do
            if file -b "$candidate" | grep -qiE 'Android sparse image|ext[234] filesystem|EROFS filesystem'; then IMAGE="$candidate"; break; fi
          done
          [ -n "$IMAGE" ] || { echo 'No supported Android filesystem image found.'; exit 1; }
          cp -- "$IMAGE" work/base.img

      - name: Prepare raw system image
        run: |
          set -euo pipefail
          if file -b work/base.img | grep -qi 'Android sparse image'; then
            simg2img work/base.img work/system.raw.img
          else
            cp -- work/base.img work/system.raw.img
          fi
          FS_INFO="$(file -b work/system.raw.img)"
          case "$FS_INFO" in
            *'EROFS filesystem'*) FS_TYPE=erofs ;;
            *'ext2 filesystem'*|*'ext3 filesystem'*|*'ext4 filesystem'*) FS_TYPE=ext4 ;;
            *) echo "Unsupported filesystem: $FS_INFO"; exit 2 ;;
          esac
          echo "FS_TYPE=$FS_TYPE" >> "$GITHUB_ENV"

      - name: Prepare filesystem for RezeOS modification
        run: |
          set -euo pipefail
          rm -rf work/root work/mnt
          mkdir -p work/root work/mnt
          if [ "$FS_TYPE" = ext4 ]; then
            FS_FEATURES="$(sudo dumpe2fs -h work/system.raw.img 2>/dev/null | sed -n 's/^Filesystem features:[[:space:]]*//p')"
            echo "Filesystem features: $FS_FEATURES"
            if grep -qw shared_blocks <<< "$FS_FEATURES"; then
              sudo e2fsck -fy -E unshare_blocks work/system.raw.img
            else
              sudo e2fsck -fy work/system.raw.img
            fi
            sudo mount -t ext4 -o loop,ro work/system.raw.img work/mnt
            sudo umount work/mnt
            sudo mount -t ext4 -o loop,rw work/system.raw.img work/mnt
            sudo mountpoint -q work/mnt
            echo "SYSTEM_DIR=$PWD/work/mnt" >> "$GITHUB_ENV"
            echo 'Mounted ext4 filesystem is ready for direct RezeOS modification.'
          else
            sudo fsck.erofs --extract=work/root work/system.raw.img
            echo "SYSTEM_DIR=$PWD/work/root" >> "$GITHUB_ENV"
          fi

      - name: Modify RezeOS system and default wallpaper
        run: |
          set -euo pipefail
          sudo env SYSTEM_DIR="$SYSTEM_DIR" REZEOS_NAME=RezeOS REZEOS_VERSION=1.0-BETA REZEOS_CODENAME=Reze REZEOS_BASE=RezeOS-23.2-20260524-VANILLA-EXT4-GSI WALLPAPER_ASSET="$PWD/assets/reze-wallpaper.webp" bash scripts/modify-system.sh

          PROP="$SYSTEM_DIR/build.prop"
          [ -f "$PROP" ] || PROP="$SYSTEM_DIR/system/build.prop"
          sudo test -s "$PROP"
          sudo grep -Fx 'ro.rezeos.name=RezeOS' "$PROP"
          sudo grep -Fx 'ro.rezeos.version=1.0-BETA' "$PROP"
          sudo grep -Fx 'ro.rezeos.codename=Reze' "$PROP"
          sudo grep -Fx 'ro.rezeos.base=RezeOS-23.2-20260524-VANILLA-EXT4-GSI' "$PROP"
          sudo grep -Fx 'ro.product.brand=RezeOS' "$PROP"
          sudo grep -Fx 'ro.product.manufacturer=RezeOS' "$PROP"
          sudo grep -Fx 'ro.product.model=RezeOS' "$PROP"
          sudo grep -Fx 'ro.product.name=RezeOS' "$PROP"
          sudo grep -Fx 'ro.product.device=reze' "$PROP"
          sudo grep -Fx 'ro.build.display.id=RezeOS-1.0-BETA' "$PROP"
          sudo grep -Fx 'ro.config.wallpaper=/system/media/rezeos_default.webp' "$PROP"
          sudo test -s "$SYSTEM_DIR/system/media/rezeos_default.webp"
          ! sudo grep -qi 'lineageos' "$PROP"

      - name: Rebuild modified system image
        run: |
          set -euo pipefail
          if [ "$FS_TYPE" = ext4 ]; then
            sync
            sudo umount work/mnt
            sudo e2fsck -fy work/system.raw.img
            mv work/system.raw.img work/rebuilt.raw.img
          else
            mkfs.erofs -zlz4hc work/rebuilt.raw.img work/root
          fi
          file work/rebuilt.raw.img

      - name: Repack Android sparse image
        run: |
          set -euo pipefail
          img2simg work/rebuilt.raw.img work/system.img
          xz -T0 -9 -c work/system.img > out/RezeOS-GSI-arm64-ab.img.xz
          sha256sum out/RezeOS-GSI-arm64-ab.img.xz > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: RezeOS-GSI
          path: out/
          if-no-files-found: error
