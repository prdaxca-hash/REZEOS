name: Build RezeOS GSI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl xz-utils e2fsprogs file android-sdk-libsparse-utils

      - name: Download Axion GSI
        run: |
          source config/reze.env
          mkdir -p work out
          curl -L "$BASE_URL" -o work/base.img.xz
          xz -d -c work/base.img.xz > work/system.img

      - name: Apply RezeOS modifications
        run: |
          sudo mkdir -p work/mnt
          sudo mount -o loop,rw work/system.img work/mnt
          SYSTEM_DIR=$PWD/work/mnt \
          REZEOS_NAME=RezeOS \
          REZEOS_VERSION=1.0-BETA \
          REZEOS_CODENAME=Reze \
          bash scripts/modify-system.sh
          sync
          sudo umount work/mnt

      - name: Package output
        run: |
          xz -T0 -9 -c work/system.img > out/RezeOS-GSI-arm64-ab.img.xz
          sha256sum out/RezeOS-GSI-arm64-ab.img.xz > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: RezeOS-GSI
          path: out/
