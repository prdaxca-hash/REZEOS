name: Build RezeOS from LineageOS GSI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            7zip \
            android-sdk-libsparse-utils \
            curl \
            e2fsprogs \
            erofs-utils \
            file \
            xz-utils

      - name: Download and extract LineageOS GSI
        env:
          BASE_URL: ${{ vars.REZEOS_BASE_URL }}
        run: |
          set -euo pipefail
          source config/reze.env
          : "${BASE_URL:=$BASE_URL}"

          rm -rf work out
          mkdir -p work/extracted out

          echo '--- downloading LineageOS GSI archive ---'
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --output work/base.7z "$BASE_URL"

          echo '--- archive type ---'
          file work/base.7z

          echo '--- archive contents ---'
          7z l work/base.7z | tail -40

          echo '--- extracting archive ---'
          7z x -y -owork/extracted work/base.7z >/tmp/rezeos-7z.log
          cat /tmp/rezeos-7z.log

          echo '--- locating Android image ---'
          mapfile -t IMAGES < <(find work/extracted -type f \
            \( -iname '*.img' -o -iname '*.img.raw' \) \
            -printf '%p\n' | sort)

          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo 'No Android system image found in LineageOS archive.'
            find work/extracted -maxdepth 4 -type f -print | sort | head -200
            exit 1
          fi

          printf 'Candidate images:\n%s\n' "${IMAGES[*]}"

          IMAGE=''
          for candidate in "${IMAGES[@]}"; do
            if file -b "$candidate" | grep -qiE 'Android sparse image|ext[234] filesystem|EROFS filesystem'; then
              IMAGE="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo 'No supported Android filesystem image found.'
            for candidate in "${IMAGES[@]}"; do
              printf '%s: %s\n' "$candidate" "$(file -b "$candidate")"
            done
            exit 1
          fi

          echo "Using image: $IMAGE"
          cp -- "$IMAGE" work/base.img
          file work/base.img

      - name: Prepare raw system image
        run: |
          set -euo pipefail

          rm -f work/system.raw.img
          if file -b work/base.img | grep -qi 'Android sparse image'; then
            echo 'Converting Android sparse image to raw image'
            simg2img work/base.img work/system.raw.img
          else
            cp -- work/base.img work/system.raw.img
          fi

          FS_INFO="$(file -b work/system.raw.img)"
          echo "Filesystem: $FS_INFO"

          case "$FS_INFO" in
            *'EROFS filesystem'*) FS_TYPE=erofs ;;
            *'ext2 filesystem'*|*'ext3 filesystem'*|*'ext4 filesystem'*) FS_TYPE=ext4 ;;
            *)
              echo 'Unsupported filesystem:'
              printf '%s\n' "$FS_INFO"
              exit 2
              ;;
          esac

          echo "Detected filesystem: $FS_TYPE"
          echo "FS_TYPE=$FS_TYPE" >> "$GITHUB_ENV"

      - name: Validate copy tool before touching the image
        run: |
          set -euo pipefail
          cp --version | head -1
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir -p "$tmpdir/src/dir" "$tmpdir/dst"
          printf 'copy smoke test\n' > "$tmpdir/src/dir/file"
          cp -a -- "$tmpdir/src/." "$tmpdir/dst/"
          test -f "$tmpdir/dst/dir/file"
          echo 'cp -a smoke test passed'

      - name: Prepare filesystem tree
        run: |
          set -euo pipefail
          rm -rf work/root work/mnt
          mkdir -p work/root work/mnt

          if [ "$FS_TYPE" = 'ext4' ]; then
            echo '--- ext4 feature inspection ---'
            sudo dumpe2fs -h work/system.raw.img 2>/dev/null \
              | grep -E 'Filesystem features|Block size|Block count' || true

            FS_FEATURES="$(sudo dumpe2fs -h work/system.raw.img 2>/dev/null \
              | sed -n 's/^Filesystem features:[[:space:]]*//p')"

            if grep -qw 'shared_blocks' <<< "$FS_FEATURES"; then
              echo 'shared_blocks detected; unsharing blocks'
              sudo e2fsck -fy -E unshare_blocks work/system.raw.img
            else
              sudo e2fsck -fy work/system.raw.img
            fi

            echo '--- test read-only mount ---'
            sudo mount -t ext4 -o loop,ro work/system.raw.img work/mnt
            sudo umount work/mnt

            echo '--- mount read-write ---'
            sudo mount -t ext4 -o loop,rw work/system.raw.img work/mnt

            echo '--- copy mounted filesystem to working tree ---'
            sudo cp -a -- work/mnt/. work/root/
            sudo umount work/mnt
          else
            echo '--- extract EROFS filesystem ---'
            sudo fsck.erofs --extract=work/root work/system.raw.img
          fi

          test -d work/root/etc
          echo 'Working system tree prepared.'

      - name: Modify RezeOS system tree
        env:
          SYSTEM_DIR: ${{ github.workspace }}/work/root
          REZEOS_NAME: RezeOS
          REZEOS_VERSION: 1.0-BETA
          REZEOS_CODENAME: Reze
          REZEOS_BASE: LineageOS-23.2-20260524-VANILLA-EXT4-GSI
        run: |
          set -euo pipefail
          sudo env \
            SYSTEM_DIR="$SYSTEM_DIR" \
            REZEOS_NAME="$REZEOS_NAME" \
            REZEOS_VERSION="$REZEOS_VERSION" \
            REZEOS_CODENAME="$REZEOS_CODENAME" \
            REZEOS_BASE="$REZEOS_BASE" \
            bash scripts/modify-system.sh

          test -f work/root/etc/rezeos/build-info
          grep -Fx 'NAME=RezeOS' work/root/etc/rezeos/build-info
          grep -Fx 'VERSION=1.0-BETA' work/root/etc/rezeos/build-info
          grep -Fx 'CODENAME=Reze' work/root/etc/rezeos/build-info
          grep -Fx "BASE=$REZEOS_BASE" work/root/etc/rezeos/build-info

      - name: Rebuild modified system image
        run: |
          set -euo pipefail
          rm -f work/rebuilt.raw.img work/system.img

          if [ "$FS_TYPE" = 'ext4' ]; then
            echo '--- remounting ext4 read-write ---'
            sudo mount -t ext4 -o loop,rw work/system.raw.img work/mnt

            echo '--- copying modified tree back to ext4 image ---'
            sudo cp -a -- work/root/. work/mnt/
            sync
            sudo umount work/mnt

            echo '--- final ext4 filesystem check ---'
            sudo e2fsck -fy work/system.raw.img
            mv work/system.raw.img work/rebuilt.raw.img
          else
            echo '--- rebuilding EROFS image ---'
            mkfs.erofs -zlz4hc work/rebuilt.raw.img work/root
          fi

          echo '--- rebuilt image ---'
          file work/rebuilt.raw.img

      - name: Repack Android sparse image
        run: |
          set -euo pipefail
          img2simg work/rebuilt.raw.img work/system.img
          file work/system.img
          xz -T0 -9 -c work/system.img > out/RezeOS-GSI-arm64-ab.img.xz
          sha256sum out/RezeOS-GSI-arm64-ab.img.xz > out/SHA256SUMS

      - name: Upload RezeOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RezeOS-GSI
          path: out/
          if-no-files-found: error
