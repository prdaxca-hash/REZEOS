name: Build RezeOS GSI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils e2fsprogs erofs-utils file android-sdk-libsparse-utils

      - name: Download RestlessOS base GSI and Reze photo
        run: |
          set -euo pipefail
          mkdir -p work/extracted out assets
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0' \
            --output assets/reze-wallpaper.jpg \
            'https://moegirl.uk/images/3/3b/Chainsawman_Moive.jpg'
          file assets/reze-wallpaper.jpg
          grep -qi 'JPEG image' < <(file -b assets/reze-wallpaper.jpg)

          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --output work/base.img.xz \
            'https://github.com/cawilliamson/treble_restlessos/releases/download/16.0.0-202606230923/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz'
          file work/base.img.xz
          xz -d -c work/base.img.xz > work/base.img
          file work/base.img

      - name: Prepare raw system image
        run: |
          set -euo pipefail
          if file -b work/base.img | grep -qi 'Android sparse image'; then
            simg2img work/base.img work/system.raw.img
          else
            cp -- work/base.img work/system.raw.img
          fi
          FS_INFO="$(file -b work/system.raw.img)"
          case "$FS_INFO" in
            *'EROFS filesystem'*) FS_TYPE=erofs ;;
            *'ext2 filesystem'*|*'ext3 filesystem'*|*'ext4 filesystem'*) FS_TYPE=ext4 ;;
            *) echo "Unsupported filesystem: $FS_INFO"; exit 2 ;;
          esac
          echo "FS_TYPE=$FS_TYPE" >> "$GITHUB_ENV"

      - name: Prepare filesystem for modification
        run: |
          set -euo pipefail
          rm -rf work/root work/mnt
          mkdir -p work/root work/mnt
          if [ "$FS_TYPE" = ext4 ]; then
            FS_FEATURES="$(sudo dumpe2fs -h work/system.raw.img 2>/dev/null | sed -n 's/^Filesystem features:[[:space:]]*//p')"
            if grep -qw shared_blocks <<< "$FS_FEATURES"; then
              sudo e2fsck -fy -E unshare_blocks work/system.raw.img
            else
              sudo e2fsck -fy work/system.raw.img
            fi
            sudo mount -t ext4 -o loop,ro work/system.raw.img work/mnt
            sudo umount work/mnt
            sudo mount -t ext4 -o loop,rw work/system.raw.img work/mnt
            sudo mountpoint -q work/mnt
            echo "SYSTEM_DIR=$PWD/work/mnt" >> "$GITHUB_ENV"
          else
            sudo fsck.erofs --extract=work/root work/system.raw.img
            echo "SYSTEM_DIR=$PWD/work/root" >> "$GITHUB_ENV"
          fi

      - name: Apply RezeOS branding and photo wallpaper
        run: |
          set -euo pipefail
          sudo env SYSTEM_DIR="$SYSTEM_DIR" \
            REZEOS_NAME=RezeOS \
            REZEOS_VERSION=1.0-BETA \
            REZEOS_CODENAME=Reze \
            REZEOS_BASE=RestlessOS-16.0.0-202606230923 \
            WALLPAPER_ASSET="$PWD/assets/reze-wallpaper.jpg" \
            bash scripts/modify-system.sh

      - name: Rebuild modified system image
        run: |
          set -euo pipefail
          if [ "$FS_TYPE" = ext4 ]; then
            sync
            sudo umount work/mnt
            sudo e2fsck -fy work/system.raw.img
            mv work/system.raw.img work/rebuilt.raw.img
          else
            mkfs.erofs -zlz4hc work/rebuilt.raw.img work/root
          fi
          file work/rebuilt.raw.img

      - name: Repack Android sparse image
        run: |
          set -euo pipefail
          img2simg work/rebuilt.raw.img work/system.img
          xz -T0 -9 -c work/system.img > out/RezeOS-GSI-arm64-ab.img.xz
          sha256sum out/RezeOS-GSI-arm64-ab.img.xz > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: RezeOS-GSI
          path: out/
          if-no-files-found: error
