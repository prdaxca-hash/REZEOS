name: Build RezeOS GSI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl xz-utils e2fsprogs file android-sdk-libsparse-utils

      - name: Download Axion GSI
        run: |
          set -euo pipefail
          source config/reze.env
          mkdir -p work out
          curl -fL --retry 5 --retry-delay 3 -o work/base.img.xz "$BASE_URL"
          xz -dc work/base.img.xz > work/base.img
          file work/base.img

      - name: Convert sparse image to raw ext4
        run: |
          set -euo pipefail
          if file work/base.img | grep -qi 'Android sparse image'; then
            simg2img work/base.img work/system.raw.img
          else
            cp work/base.img work/system.raw.img
          fi
          file work/system.raw.img
          sudo e2fsck -fy work/system.raw.img

      - name: Apply RezeOS modifications
        run: |
          set -euo pipefail
          sudo mkdir -p work/mnt
          sudo mount -o loop,rw work/system.raw.img work/mnt
          trap 'sudo umount work/mnt || true' EXIT

          SYSTEM_DIR="$PWD/work/mnt" \
          REZEOS_NAME=RezeOS \
          REZEOS_VERSION=1.0-BETA \
          REZEOS_CODENAME=Reze \
          bash scripts/modify-system.sh

          sync
          sudo umount work/mnt
          trap - EXIT
          sudo e2fsck -fy work/system.raw.img

      - name: Repack Android sparse image
        run: |
          set -euo pipefail
          img2simg work/system.raw.img work/system.img
          file work/system.img
          xz -T0 -9 -c work/system.img > out/RezeOS-GSI-arm64-ab.img.xz
          sha256sum out/RezeOS-GSI-arm64-ab.img.xz > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: RezeOS-GSI
          path: out/
          if-no-files-found: error
