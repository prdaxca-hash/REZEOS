name: Extract LineageOS source tree

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl 7zip e2fsprogs xz-utils zstd file android-sdk-libsparse-utils

      - name: Download and extract LineageOS base
        run: |
          set -euo pipefail
          source config/reze.env
          mkdir -p work/archive work/extracted work/tree/system out

          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --output work/archive/lineageos.7z "$BASE_URL"
          7z x -y -owork/extracted work/archive/lineageos.7z

          mapfile -t IMAGES < <(find work/extracted -type f \( -iname '*.img' -o -iname '*.img.raw' \) -print | sort)
          [ "${#IMAGES[@]}" -gt 0 ] || { echo 'No image found in LineageOS archive'; exit 1; }

          IMAGE=''
          for candidate in "${IMAGES[@]}"; do
            if file -b "$candidate" | grep -qiE 'Android sparse image|ext[234] filesystem|EROFS filesystem'; then
              IMAGE="$candidate"
              break
            fi
          done
          [ -n "$IMAGE" ] || { echo 'No supported Android filesystem image found'; exit 1; }

          if file -b "$IMAGE" | grep -qi 'Android sparse image'; then
            simg2img "$IMAGE" work/system.raw.img
          else
            cp -- "$IMAGE" work/system.raw.img
          fi

          FS_INFO="$(file -b work/system.raw.img)"
          echo "Base image: $IMAGE" | tee out/SOURCE_INFO.txt
          echo "Filesystem: $FS_INFO" | tee -a out/SOURCE_INFO.txt

      - name: Extract system tree with metadata
        run: |
          set -euo pipefail
          mkdir -p work/mnt
          sudo e2fsck -fy work/system.raw.img
          sudo mount -t ext4 -o loop,ro work/system.raw.img work/mnt

          sudo tar --xattrs --acls --numeric-owner --same-permissions \
            -C work/mnt -cpf work/system-tree.tar .

          sudo umount work/mnt
          zstd -T0 -19 work/system-tree.tar -o out/system-tree.tar.zst
          rm -f work/system-tree.tar

      - name: Generate source inventory
        run: |
          set -euo pipefail
          zstd -dc out/system-tree.tar.zst | tar -tvf - > out/system-tree.manifest
          {
            echo '--- top-level directories ---'
            awk '{print $6}' out/system-tree.manifest | sed 's#^\./##' | cut -d/ -f1 | sort -u
            echo
            echo '--- branding candidates ---'
            grep -iE 'lineage|setupwizard|wallpaper|launcher|framework|settings' out/system-tree.manifest | head -n 300 || true
          } > out/source-audit.txt

      - name: Upload extracted source tree
        uses: actions/upload-artifact@v4
        with:
          name: RezeOS-source-tree
          path: |
            out/system-tree.tar.zst
            out/system-tree.manifest
            out/source-audit.txt
            out/SOURCE_INFO.txt
          if-no-files-found: error
